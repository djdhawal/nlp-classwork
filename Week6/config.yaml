qdrant:
  url: "http://localhost:6333"

llm:
  base_url:  "http://localhost:11434/v1" # "https://openrouter.ai/api/v1" 
  model: "llama3.2:latest" # or "llama3.2:3b"
  models:
    - "meta-llama/llama3.2:latest"
    - "openai/gpt-4o-mini"
    - "llama3.2:3b"

ollama:
  url: "http://localhost:11434"
  model: "llama3.2:3b"
  embedding_model: "nomic-embed-text"   # `ollama pull nomic-embed-text` (used by 6.12)
  models:
    - "llama3.2:3b"

openai:
  model: "gpt-4o-mini"
  embedding_model: "text-embedding-3-small"

anthropic:
  model: "claude-3-5-haiku-20241022"

huggingface:
  text_model: "mistralai/Mistral-7B-Instruct-v0.3"
  instruct_model: "meta-llama/Llama-3.2-3B-Instruct"
  zero_shot_model: "facebook/bart-large-mnli"

openrouter:
  base_url: "https://openrouter.ai/api/v1"
  model: "meta-llama/llama-3.2-3b-instruct:free"
  models_to_compare:
    "Llama 3.2 3B": "meta-llama/llama-3.2-3b-instruct:free"
    "Mistral 7B": "mistralai/mistral-7b-instruct:free"
    "Gemma 3 12B": "google/gemma-3-12b-it:free"
    "Qwen 2.5 7B": "qwen/qwen-2.5-7b-instruct:free"

litellm:
  models:
    - "ollama/llama3.2"

whisper:
  model: "base"
  models:
    - "tiny"
    - "base"

embeddings:
  model: "sentence-transformers/all-mpnet-base-v2"
  dense_model: "BAAI/bge-small-en-v1.5"

hotpotqa:
  collection: "hotpotqa_passages"
  split: "validation"          # validation split — no label leakage, faster download than train
  sample_size: 100             # 100 questions × 10 distractor paragraphs each
  random_seed: 42
  qa_pairs_cache: "/tmp/hotpotqa_qa_pairs.json"
  passages_cache: "/tmp/hotpotqa_passages.json"
